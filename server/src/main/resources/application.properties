spring.application.name=atlas-gis-server

# 只监听本机：API 没有登录鉴权，不应暴露到局域网。
server.address=127.0.0.1
# 8080 已被 GeoServer 占用，后端默认使用 8081。
server.port=${ATLAS_SERVER_PORT:8081}

# 数据库连接。密码不要写在这里：通过环境变量 ATLAS_DB_PASSWORD 提供，
# 或在 server/config/application.properties（已被 .gitignore 忽略）中覆盖。
spring.datasource.url=${ATLAS_DB_URL:jdbc:postgresql://localhost:5432/atlas_gis}
spring.datasource.username=${ATLAS_DB_USER:postgres}
spring.datasource.password=${ATLAS_DB_PASSWORD:}

# 启动时执行 schema.sql / data.sql 建表并写入示例数据（脚本可重复执行）。
spring.sql.init.mode=always
# 前端通过 Vite 代理以同源方式访问 /api，因此不开启 CORS，其他网站无法跨域调用接口。
